<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="IH SAFY - AI and Machine Learning Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04060F"/>
      <stop offset="50%" stop-color="#0A0F22"/>
      <stop offset="100%" stop-color="#160A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF;#7C3AED;#FF2D8B;#00E5FF" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#FF2D8B;#00E5FF;#7C3AED" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7DF9FF">
        <animate attributeName="stop-color" values="#7DF9FF;#C77DFF;#FF7AD9;#7DF9FF" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="52%" stop-color="#C77DFF">
        <animate attributeName="stop-color" values="#C77DFF;#FF7AD9;#7DF9FF;#C77DFF" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF7AD9">
        <animate attributeName="stop-color" values="#FF7AD9;#7DF9FF;#C77DFF;#FF7AD9" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#14284A" stroke-width="1"/>
    </pattern>
    <filter id="softglow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .scan { animation: scanmove 5.5s linear infinite; }
    .p { animation: pulse 3.2s ease-in-out infinite; }
    .float { animation: float 6s ease-in-out infinite; }
    .border { animation: dash 26s linear infinite; }
    @keyframes scanmove { 0% { transform: translateY(-30px); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateY(330px); opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.85; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes dash { to { stroke-dashoffset: -1200; } }
  </style>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.35"/>

  <rect x="3" y="3" width="1194" height="294" rx="18" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="14 8" class="border" opacity="0.9"/>

  <path d="M24 62 V34 H62" fill="none" stroke="#00E5FF" stroke-width="3" opacity="0.8"/>
  <path d="M1176 62 V34 H1138" fill="none" stroke="#FF2D8B" stroke-width="3" opacity="0.8"/>
  <path d="M24 238 V266 H62" fill="none" stroke="#7C3AED" stroke-width="3" opacity="0.8"/>
  <path d="M1176 238 V266 H1138" fill="none" stroke="#00E5FF" stroke-width="3" opacity="0.8"/>

  <rect class="scan" x="30" y="0" width="1140" height="26" rx="13" fill="url(#scan)"/>

  <circle class="p float" cx="140" cy="70" r="3" fill="#00E5FF"/>
  <circle class="p float" cx="1050" cy="92" r="3" fill="#FF2D8B" style="animation-delay:.8s"/>
  <circle class="p float" cx="300" cy="244" r="2.5" fill="#7C3AED" style="animation-delay:1.6s"/>
  <circle class="p float" cx="960" cy="232" r="2.5" fill="#00E5FF" style="animation-delay:2.2s"/>
  <circle class="p float" cx="600" cy="40" r="2.5" fill="#FFD166" style="animation-delay:1.1s"/>

  <text x="600" y="146" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="10" fill="url(#title)" filter="url(#softglow)">IH SAFY</text>

  <rect x="470" y="176" width="260" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" values="180;300;180" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="510;450;510" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="214" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" letter-spacing="4" fill="#A9C4E4">AI &amp; ML ENGINEER · COMPUTER VISION · MEDICAL IMAGING</text>

  <text x="600" y="248" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="14" letter-spacing="3" fill="#5B7BA6">@ihsafy · Dhaka, Bangladesh · Open to work</text>
</svg>
