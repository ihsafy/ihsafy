<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12" role="img" aria-label="Animated gradient divider">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="25%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#FF2D8B"/>
      <stop offset="75%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes dflow { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    .dflow { animation: dflow 9s linear infinite; }
  </style>
  <g class="dflow">
    <rect x="0" y="4" width="1200" height="4" rx="2" fill="url(#dg)"/>
    <rect x="1200" y="4" width="1200" height="4" rx="2" fill="url(#dg)"/>
  </g>
</svg>
