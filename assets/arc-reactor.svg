<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520" role="img" aria-labelledby="arTitle arDesc">
  <title id="arTitle">Arc Reactor — JARVIS Energy Core</title>
  <desc id="arDesc">Animated arc reactor with concentric rotating rings, orbiting node and a glowing cyan core</desc>
  <defs>
    <radialGradient id="bg2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#101625"/>
      <stop offset="0.7" stop-color="#080B12"/>
      <stop offset="1" stop-color="#05070C"/>
    </radialGradient>
    <radialGradient id="core2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#7DEBFF"/>
      <stop offset="0.7" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#0B3B5E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5B942"/>
      <stop offset="0.5" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#B8740F"/>
    </linearGradient>
  </defs>

  <rect width="520" height="520" fill="url(#bg2)"/>

  <g stroke="#E62429" stroke-width="3" fill="none">
    <path d="M18,18 H70 M18,18 V70"/>
    <path d="M502,18 H450 M502,18 V70"/>
    <path d="M18,502 V450 M18,502 H70"/>
    <path d="M502,502 V450 M502,502 H450"/>
  </g>

  <text x="260" y="82" text-anchor="middle" font-family="Consolas,monospace" font-size="24" font-weight="bold" letter-spacing="8" fill="#F5B942">ARC REACTOR</text>
  <text x="260" y="108" text-anchor="middle" font-family="Consolas,monospace" font-size="13" letter-spacing="3" fill="#00E5FF">MARK &#8734; // CORE ONLINE</text>

  <!-- outer segmented rings -->
  <circle cx="260" cy="260" r="215" fill="none" stroke="url(#gold2)" stroke-width="18" stroke-dasharray="14 10">
    <animateTransform attributeName="transform" type="rotate" from="0 260 260" to="360 260 260" dur="28s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="260" r="185" fill="none" stroke="#E62429" stroke-width="6" stroke-dasharray="40 18" opacity="0.85">
    <animateTransform attributeName="transform" type="rotate" from="360 260 260" to="0 260 260" dur="36s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="260" r="150" fill="none" stroke="#00E5FF" stroke-width="4" stroke-dasharray="24 12">
    <animateTransform attributeName="transform" type="rotate" from="0 260 260" to="360 260 260" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="260" r="120" fill="none" stroke="#F5B942" stroke-width="2" opacity="0.6" stroke-dasharray="90 22">
    <animateTransform attributeName="transform" type="rotate" from="360 260 260" to="0 260 260" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- spokes -->
  <g stroke="#F5B942" stroke-width="2" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="0 260 260" to="360 260 260" dur="20s" repeatCount="indefinite"/>
    <line x1="260" y1="148" x2="260" y2="372"/>
    <line x1="148" y1="260" x2="372" y2="260"/>
    <line x1="181" y1="181" x2="339" y2="339"/>
    <line x1="339" y1="181" x2="181" y2="339"/>
  </g>

  <!-- inner ring + core -->
  <circle cx="260" cy="260" r="88" fill="none" stroke="#F5B942" stroke-width="3" stroke-dasharray="6 8">
    <animateTransform attributeName="transform" type="rotate" from="0 260 260" to="360 260 260" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="260" r="70" fill="url(#core2)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="260" r="40" fill="#00E5FF" opacity="0.9">
    <animate attributeName="r" values="36;44;36" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="260" r="26" fill="#FFFFFF" opacity="0.85">
    <animate attributeName="r" values="22;28;22" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- crosshair ticks + labels -->
  <g stroke="#00E5FF" stroke-width="2" opacity="0.55">
    <line x1="260" y1="99" x2="260" y2="113"/>
    <line x1="260" y1="407" x2="260" y2="421"/>
    <line x1="99" y1="260" x2="113" y2="260"/>
    <line x1="407" y1="260" x2="421" y2="260"/>
  </g>
  <g font-family="Consolas,monospace" font-size="12" fill="#F5F7FA" fill-opacity="0.5" text-anchor="middle">
    <text x="260" y="94">0&#176;</text>
    <text x="260" y="440">180&#176;</text>
    <text x="90" y="264">270&#176;</text>
    <text x="430" y="264">90&#176;</text>
  </g>

  <!-- orbiting node -->
  <circle r="6" fill="#E62429">
    <animateMotion dur="10s" repeatCount="indefinite" path="M260,45 a215,215 0 1,1 -0.01,0 z"/>
  </circle>

  <text x="260" y="462" text-anchor="middle" font-family="Consolas,monospace" font-size="12" letter-spacing="3" fill="#F5B942">ENERGY MATRIX: CHARGED</text>
  <text x="260" y="482" text-anchor="middle" font-family="Consolas,monospace" font-size="11" letter-spacing="2" fill="#F5F7FA" fill-opacity="0.55">J.A.R.V.I.S. CORE v2 &#183; DECORATIVE DISPLAY</text>
</svg>