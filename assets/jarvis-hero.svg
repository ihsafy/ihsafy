<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">J.A.R.V.I.S. Developer Interface — IH SAFY</title>
  <desc id="heroDesc">Animated JARVIS-style engineering banner for IH SAFY, AI and machine learning engineer with an arc reactor and holographic scan line</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B12"/>
      <stop offset="0.55" stop-color="#0F1524"/>
      <stop offset="1" stop-color="#1C1020"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E62429" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F5B942" stop-opacity="1"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#0B3B5E" stop-opacity="0.15"/>
    </radialGradient>
    <linearGradient id="ringGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5B942"/>
      <stop offset="1" stop-color="#B8740F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- circuit traces -->
  <g stroke="#F5B942" stroke-opacity="0.14" fill="none" stroke-width="1.5">
    <polyline points="50,70 130,70 130,160 200,160"/>
    <circle cx="200" cy="160" r="3.5" fill="#F5B942" fill-opacity="0.35"/>
    <polyline points="1150,70 1070,70 1070,150 990,150"/>
    <circle cx="990" cy="150" r="3.5" fill="#F5B942" fill-opacity="0.35"/>
    <polyline points="50,360 150,360 150,300"/>
    <polyline points="1150,370 1060,370 1060,320 980,320"/>
  </g>
  <g stroke="#00E5FF" stroke-opacity="0.12" fill="none" stroke-width="1.5">
    <polyline points="600,40 600,90 540,90"/>
    <polyline points="620,40 620,110 700,110 700,150"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#E62429" stroke-width="3" fill="none">
    <path d="M28,28 H96 M28,28 V96"/>
    <path d="M1172,28 H1104 M1172,28 V96"/>
    <path d="M28,392 V324 M28,392 H96"/>
    <path d="M1172,392 V324 M1172,392 H1104"/>
  </g>

  <!-- top hud text -->
  <text x="110" y="52" font-family="Consolas,monospace" font-size="13" letter-spacing="2" fill="#F5B942">J.A.R.V.I.S. INTERFACE v9.7</text>
  <text x="1090" y="52" text-anchor="end" font-family="Consolas,monospace" font-size="13" letter-spacing="2" fill="#00E5FF">TERMINAL: ihsafy</text>

  <!-- main title block -->
  <text x="60" y="150" font-family="Consolas,monospace" font-size="42" font-weight="bold" letter-spacing="2" fill="#F5B942">J.A.R.V.I.S<tspan fill="#E62429">.</tspan></text>
  <text x="62" y="180" font-family="Consolas,monospace" font-size="19" letter-spacing="5" fill="#00E5FF">// DEVELOPER INTERFACE</text>

  <text x="60" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="52" font-weight="bold" letter-spacing="3" fill="#F5F7FA">IH SAFY</text>
  <text x="62" y="290" font-family="Consolas,monospace" font-size="16" letter-spacing="1" fill="#00E5FF">AI / MACHINE LEARNING / SOFTWARE ENGINEERING</text>
  <text x="62" y="314" font-family="Consolas,monospace" font-size="15" letter-spacing="1" fill="#F5B942">COMPUTER VISION &#183; MEDICAL IMAGING &#183; DATA ANALYTICS</text>
  <text x="62" y="342" font-family="Consolas,monospace" font-size="15" fill="#22C55E">&#9654; SYSTEM INITIALIZATION COMPLETE &#8212; STATUS: ONLINE</text>

  <!-- blinking cursor -->
  <rect x="512" y="330" width="10" height="16" fill="#00E5FF">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- holographic faceplate glyph -->
  <g>
    <path d="M655,196 L702,164 L749,196 L749,252 L702,284 L655,252 Z" fill="#101625" fill-opacity="0.6" stroke="#F5B942" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M667,210 L702,184 L737,210" fill="none" stroke="#F5B942" stroke-opacity="0.8" stroke-width="2"/>
    <path d="M672,258 L702,276 L732,258" fill="none" stroke="#E62429" stroke-opacity="0.7" stroke-width="2"/>
    <polygon points="686,216 704,216 699,226 682,226" fill="#00E5FF">
      <animate attributeName="opacity" values="0.95;0.25;0.95" dur="4s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="716,216 734,216 738,226 721,226" fill="#00E5FF">
      <animate attributeName="opacity" values="0.95;0.25;0.95" dur="4s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="702" cy="211" r="16" fill="none" stroke="#00E5FF" stroke-opacity="0.35" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0 702 211" to="360 702 211" dur="10s" repeatCount="indefinite"/>
    </circle>
    <text x="702" y="312" text-anchor="middle" font-family="Consolas,monospace" font-size="11" letter-spacing="3" fill="#00E5FF" opacity="0.9">HOLO FACEPLATE</text>
  </g>

  <!-- arc reactor -->
  <g>
    <circle cx="930" cy="210" r="150" fill="none" stroke="url(#ringGold)" stroke-width="3"/>
    <circle cx="930" cy="210" r="136" fill="none" stroke="#F5B942" stroke-width="22" stroke-dasharray="16 11" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0 930 210" to="360 930 210" dur="26s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="210" r="104" fill="none" stroke="#00E5FF" stroke-width="3" stroke-dasharray="28 12">
      <animateTransform attributeName="transform" type="rotate" from="360 930 210" to="0 930 210" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="210" r="72" fill="none" stroke="#E62429" stroke-width="3" stroke-dasharray="8 9">
      <animateTransform attributeName="transform" type="rotate" from="0 930 210" to="360 930 210" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="210" r="34" fill="url(#core)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="210" r="48" fill="none" stroke="#F5F7FA" stroke-opacity="0.25" stroke-width="1.5"/>
    <g stroke="#F5B942" stroke-width="2" opacity="0.45">
      <animateTransform attributeName="transform" type="rotate" from="0 930 210" to="360 930 210" dur="40s" repeatCount="indefinite"/>
      <line x1="930" y1="110" x2="930" y2="310"/>
      <line x1="830" y1="210" x2="1030" y2="210"/>
      <line x1="859" y1="139" x2="1001" y2="281"/>
      <line x1="1001" y1="139" x2="859" y2="281"/>
    </g>
    <circle r="5" fill="#E62429">
      <animateMotion dur="7s" repeatCount="indefinite" path="M930,60 a150,150 0 1,1 -0.01,0 z"/>
    </circle>
    <text x="930" y="380" text-anchor="middle" font-family="Consolas,monospace" font-size="12" letter-spacing="3" fill="#F5B942">ARC REACTOR // CORE ONLINE</text>
  </g>

  <!-- scan line -->
  <line x1="30" y1="0" x2="1170" y2="0" stroke="#F5B942" stroke-opacity="0.45" stroke-width="2">
    <animate attributeName="y1" values="70;390;70" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="70;390;70" dur="9s" repeatCount="indefinite"/>
  </line>
  <circle r="4" fill="#E62429">
    <animate attributeName="cy" values="70;390;70" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="30;1170;30" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- bottom bar -->
  <line x1="40" y1="398" x2="1160" y2="398" stroke="#E62429" stroke-opacity="0.6" stroke-width="2"/>
  <text x="60" y="414" font-family="Consolas,monospace" font-size="12" fill="#F5F7FA" fill-opacity="0.75">ENGINEERING INTELLIGENCE THROUGH CODE</text>
  <text x="1140" y="414" text-anchor="end" font-family="Consolas,monospace" font-size="12" fill="#F5B942">ID: ihsafy :: BUILD v2.0</text>
</svg>